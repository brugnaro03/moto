<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efeito Parallax - Cidade em Movimento</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    canvas {
      border: 2px solid #fff;
      background-color: #000;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Instância das Imagens
    const cidadeImg = new Image();
    const carroImg = new Image();
    const motoImg = new Image();

    // Função para garantir o carregamento de cada imagem
    function carregarImagem(img, src) {
      return new Promise((resolve, reject) => {
        img.onload = () => resolve(img);
        img.onerror = () => reject(`Erro ao carregar a imagem: ${src}`);
        img.src = src;
      });
    }

    // Variáveis do Movimento
    let cidadeX = 0;
    const velocidadeCidade = 4;

    function atualizar() {
      cidadeX -= velocidadeCidade;

      if (cidadeX <= -canvas.width) {
        cidadeX = 0;
      }
    }

    function desenhar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Desenha a Cidade duas vezes lado a lado
      ctx.drawImage(cidadeImg, cidadeX, 0, canvas.width, canvas.height);
      ctx.drawImage(cidadeImg, cidadeX + canvas.width, 0, canvas.width, canvas.height);

      // 2. Desenha o Carro (posição fixa)
      ctx.drawImage(carroImg, 200, 280, 120, 60);

      // 3. Desenha a Moto (posição fixa)
      ctx.drawImage(motoImg, 80, 290, 80, 50);
    }

    function loop() {
      atualizar();
      desenhar();
      requestAnimationFrame(loop);
    }

    // Carrega as 3 imagens com os novos nomes antes de iniciar
    Promise.all([
      carregarImagem(cidadeImg, 'cidade.jpg'),
      carregarImagem(carroImg, 'carro.png'),
      carregarImagem(motoImg, 'moto.png')
    ]).then(() => {
      loop();
    }).catch(erro => {
      console.error(erro);
      alert('Certifique-se de que os arquivos cidade.jpg, carro.png e moto.png estão na mesma pasta do HTML!');
    });
  </script>

</body>
</html>
